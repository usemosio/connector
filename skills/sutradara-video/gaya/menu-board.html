<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Papan menu</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Playfair Display"; src: url("vendor/PlayfairDisplay-700.woff2"); font-weight: 700; }
      @font-face { font-family: "Playfair Display"; src: url("vendor/PlayfairDisplay-400-italic.woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-500.woff2"); font-weight: 500; }
      @font-face { font-family: "Caveat"; src: url("vendor/Caveat-700.woff2"); font-weight: 700; }
      /* Warna merek: ganti nilai ini. */
      :root { --latar: #f6eee3; --tinta: #2b1d14; --utama: #b5532a; --aksen: #3f6b4a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--latar); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--latar); color: var(--tinta);
        font-family: "Poppins", sans-serif; }
      .blob { position: absolute; border-radius: 50%; }
      .b1 { width: 760px; height: 760px; right: -300px; top: -220px; background: color-mix(in srgb, var(--utama) 18%, transparent); }
      .b2 { width: 600px; height: 600px; left: -260px; bottom: -140px; background: color-mix(in srgb, var(--aksen) 16%, transparent); }
      .frame { position: absolute; inset: 60px; border: 3px solid color-mix(in srgb, var(--tinta) 30%, transparent); border-radius: 40px; }
      .kicker { position: absolute; left: 120px; top: 250px; font-family: "Playfair Display"; font-style: italic; font-size: 64px; color: var(--utama); }
      .judul { position: absolute; left: 120px; right: 120px; top: 320px; font-family: "Playfair Display"; font-weight: 700;
        font-size: 118px; white-space: nowrap; line-height: 1; overflow: hidden; }
      .judul span { display: inline-block; }
      .underline { position: absolute; left: 112px; top: 450px; width: 560px; height: 60px; }
      .list { position: absolute; left: 120px; right: 120px; top: 560px; }
      .item { display: flex; align-items: baseline; gap: 20px; margin-bottom: 38px; }
      .item .nama { font-size: 58px; font-weight: 500; white-space: nowrap; }
      .item .dots { flex: 1; border-bottom: 5px dotted color-mix(in srgb, var(--tinta) 40%, transparent); transform: translateY(-14px); }
      .item .harga { font-family: "Playfair Display"; font-weight: 700; font-size: 62px; color: var(--utama); }
      .item small { display: block; font-size: 34px; opacity: 0.65; margin-top: 4px; }
      .fav { position: absolute; right: 110px; top: 470px; font-family: "Caveat"; font-size: 76px; color: var(--aksen); transform: rotate(-8deg); }
      .footer { position: absolute; left: 120px; right: 120px; top: 1330px; text-align: center; }
      .footer .toko { font-family: "Playfair Display"; font-weight: 700; font-size: 76px; }
      .footer .jam { margin-top: 20px; font-size: 46px; }
      .footer .ojol { display: inline-block; margin-top: 26px; padding: 22px 50px; border-radius: 60px; background: var(--aksen); color: #fff;
        font-size: 46px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="30">
      <div class="blob b1" id="b1"></div>
      <div class="blob b2" id="b2"></div>
      <div class="frame" id="frame"></div>
      <div class="kicker" id="kicker">Dari dapur kami,</div>
      <div class="judul" id="judul"><span>Menu Hari Ini</span></div>
      <svg class="underline" viewBox="0 0 560 60"><path id="garis" d="M6 40 C 140 10, 300 58, 554 22" fill="none" stroke="#b5532a" stroke-width="10" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="0" /></svg>
      <div class="fav" id="fav">favorit!</div>
      <div class="list" id="list">
        <div class="item"><div><div class="nama">Nasi Ayam Bakar</div><small>sambal matah, lalapan</small></div><div class="dots"></div><div class="harga">25K</div></div>
        <div class="item"><div><div class="nama">Soto Betawi</div><small>kuah santan gurih</small></div><div class="dots"></div><div class="harga">28K</div></div>
        <div class="item"><div><div class="nama">Mie Goreng Jawa</div><small>pakai telur bebek</small></div><div class="dots"></div><div class="harga">22K</div></div>
        <div class="item"><div><div class="nama">Es Teh Serai</div><small>segar, tidak terlalu manis</small></div><div class="dots"></div><div class="harga">8K</div></div>
      </div>
      <div class="footer" id="footer">
        <div class="toko">Dapur Mama Ika</div>
        <div class="jam">Buka setiap hari 10.00–21.00</div>
        <div class="ojol">Ada di GoFood &amp; GrabFood</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#b1", { scale: 0.9, rotation: 0 }, { scale: 1.08, rotation: 20, duration: 15, ease: "sine.inOut" }, 0)
        .fromTo("#b2", { scale: 1.05 }, { scale: 0.92, duration: 15, ease: "sine.inOut" }, 0)
        .from("#frame", { scale: 1.06, opacity: 0, duration: 0.9, ease: "power3.out" }, 0)
        .from("#kicker", { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.3)
        .from("#judul span", { yPercent: 110, duration: 0.8, ease: "expo.out" }, 0.5)
        // Garis bawah digambar seperti coretan pena.
        .fromTo("#garis", { attr: { "stroke-dashoffset": 600 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 1.1)
        // Menu masuk satu per satu: nama dulu, titik-titik memanjang, lalu harga.
        .from(".item", { x: -80, opacity: 0, duration: 0.55, ease: "power3.out", stagger: 0.55 }, 1.6)
        .from(".item .dots", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.5, ease: "power2.out", stagger: 0.55 }, 1.8)
        .from(".item .harga", { scale: 0.4, opacity: 0, duration: 0.45, ease: "back.out(2)", stagger: 0.55 }, 2.05)
        .from("#fav", { scale: 0, rotation: -40, duration: 0.5, ease: "back.out(2.4)" }, 4.2)
        .to("#fav", { rotation: -2, duration: 0.6, yoyo: true, repeat: 9, ease: "sine.inOut" }, 4.7)
        .from("#footer > *", { y: 60, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.18 }, 5.2)
        .to(".footer .ojol", { scale: 1.05, duration: 0.5, yoyo: true, repeat: 7, ease: "sine.inOut" }, 7)
        // Sorot menu satu per satu supaya layar tetap hidup.
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.5);
      // Sorot menu satu per satu supaya layar tetap hidup.
      gsap.utils.toArray(".item").forEach((item, i) => {
        tl.to(item, { x: 24, duration: 0.4, yoyo: true, repeat: 1, ease: "power2.inOut" }, 8.2 + i * 1.1)
          .to(item.querySelector(".harga"), { scale: 1.2, duration: 0.4, yoyo: true, repeat: 1, ease: "power2.inOut" }, 8.2 + i * 1.1);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
