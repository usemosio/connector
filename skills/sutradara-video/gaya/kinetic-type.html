<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kinetic type</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas Neue"; src: url("vendor/BebasNeue-400.woff2"); font-weight: 400; }
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-500.woff2"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-800.woff2"); font-weight: 800; }
      /* Warna merek: ganti tiga nilai ini. */
      :root { --latar: #17110d; --utama: #ff6b2c; --teks: #fff4e6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--latar); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--latar);
        color: var(--teks); font-family: "Poppins", sans-serif; }
      .glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 260px; border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--utama) 38%, transparent) 0%, transparent 62%); }
      .ring { position: absolute; width: 900px; height: 900px; left: 90px; top: 510px; border-radius: 50%;
        border: 3px dashed color-mix(in srgb, var(--teks) 22%, transparent); }
      /* Kata pembuka: semua di posisi yang sama, masuk dan keluar bergantian. */
      .mask { position: absolute; left: 80px; right: 80px; overflow: hidden; text-align: center; }
      .hook { top: 690px; height: 400px; }
      .w { position: absolute; left: 0; right: 0; display: block; font-family: "Bebas Neue"; font-size: 380px;
        line-height: 400px; letter-spacing: 4px; }
      .w.outline { color: transparent; -webkit-text-stroke: 5px var(--teks); }
      .w.hot { color: var(--utama); }
      /* Adegan 2: tirai warna dan nama produk. */
      .curtain { position: absolute; inset: 0; background: var(--utama); color: var(--latar); }
      .kenalan { position: absolute; left: 80px; right: 80px; top: 470px; font-size: 52px; font-weight: 500; text-align: center; }
      .nama { position: absolute; left: 60px; right: 60px; top: 580px; text-align: center; font-family: "Bebas Neue";
        font-size: 250px; line-height: 0.92; }
      .nama .line { display: block; overflow: hidden; }
      .nama .line span { display: inline-block; }
      .tape { position: absolute; left: -200px; width: 1480px; top: 1270px; height: 130px; background: var(--latar);
        color: var(--utama); transform: rotate(-6deg); overflow: hidden; }
      .tape .run { position: absolute; top: 0; left: 0; white-space: nowrap; font-family: "Bebas Neue"; font-size: 104px;
        line-height: 130px; letter-spacing: 6px; }
      /* Adegan 3: harga. */
      .harga-wrap { position: absolute; left: 80px; right: 80px; top: 600px; text-align: center; }
      .harga-label { font-size: 60px; font-weight: 500; opacity: 0.8; }
      .harga { font-family: "Bebas Neue"; font-size: 330px; line-height: 1; color: var(--utama); }
      .harga-sub { font-size: 56px; font-weight: 500; margin-top: 20px; }
      /* Penutup. */
      .cta { position: absolute; left: 80px; right: 80px; top: 640px; text-align: center; }
      .cta .usaha { font-family: "Bebas Neue"; font-size: 210px; line-height: 1; }
      .cta .ajak { display: inline-block; margin-top: 50px; padding: 30px 64px; border-radius: 80px;
        background: var(--utama); color: var(--latar); font-size: 64px; font-weight: 800; }
      .cta .info { margin-top: 56px; font-size: 50px; font-weight: 500; line-height: 1.5; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="30">
      <div class="glow" id="glow"></div>
      <div class="ring" id="ring"></div>

      <div class="mask hook" id="hook">
        <span class="w" id="w1">BOSAN</span>
        <span class="w outline" id="w2">SAMA</span>
        <span class="w" id="w3">KOPI</span>
        <span class="w hot" id="w4">BIASA?</span>
      </div>

      <div class="curtain" id="curtain">
        <div class="kenalan" id="kenalan">Kenalan sama menu baru kami</div>
        <div class="nama" id="nama">
          <span class="line"><span>ES KOPI</span></span>
          <span class="line"><span>GULA AREN</span></span>
          <span class="line"><span>PANDAN</span></span>
        </div>
        <div class="tape" id="tape"><div class="run" id="run">BARU • SEGAR • MANIS PAS • BARU • SEGAR • MANIS PAS • BARU • SEGAR • MANIS PAS •</div></div>
      </div>

      <div class="harga-wrap" id="harga-wrap">
        <div class="harga-label">Cuma</div>
        <div class="harga" id="harga">Rp18.000</div>
        <div class="harga-sub">Ukuran besar, es batu kristal</div>
      </div>

      <div class="cta" id="cta">
        <div class="usaha">KOPI SENJA</div>
        <div class="ajak" id="ajak">Mampir hari ini</div>
        <div class="info"><div>Jl. Melati No. 12, Bandung</div><div>WA 0812-3456-7890</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Latar yang selalu hidup: cahaya bernapas, cincin berputar pelan.
      tl.fromTo("#glow", { scale: 0.85 }, { scale: 1.1, duration: 7.5, ease: "sine.inOut", repeat: 1, yoyo: true }, 0)
        .fromTo("#ring", { rotation: 0 }, { rotation: 120, duration: 15, ease: "none" }, 0);

      // Pembuka: satu kata per ketukan, masuk dari bawah, keluar ke atas.
      const words = ["#w1", "#w2", "#w3", "#w4"];
      words.forEach((w, i) => {
        const t = 0.15 + i * 0.6;
        tl.fromTo(w, { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, t);
        if (i < words.length - 1) tl.to(w, { yPercent: -110, duration: 0.28, ease: "power2.in" }, t + 0.42);
      });
      tl.to("#w4", { scale: 1.12, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 2.15)
        .to("#hook", { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.95);

      // Tirai warna menyapu dari bawah, lalu nama produk baris demi baris.
      tl.fromTo("#curtain", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "expo.inOut" }, 2.9)
        .from("#kenalan", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 3.4)
        .from("#nama .line span", { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 3.55)
        .from("#tape", { xPercent: -110, duration: 0.7, ease: "expo.out" }, 4.1)
        .fromTo("#run", { x: 0 }, { x: -700, duration: 4, ease: "none" }, 4.1)
        .to("#curtain", { clipPath: "inset(0% 0% 100% 0%)", duration: 0.6, ease: "expo.inOut" }, 7.2);

      // Harga: mendarat dengan pantulan kecil, angka dihitung naik.
      const price = { v: 0 };
      const hargaEl = document.getElementById("harga");
      tl.from("#harga-wrap", { y: 120, opacity: 0, duration: 0.6, ease: "power3.out" }, 7.55)
        .to(price, {
          v: 18000, duration: 1.1, ease: "power2.out",
          onUpdate: () => { hargaEl.textContent = "Rp" + (Math.round(price.v / 500) * 500).toLocaleString("id-ID"); },
        }, 7.6)
        .to("#harga", { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, 8.7)
        .to("#harga-wrap", { y: -120, opacity: 0, duration: 0.45, ease: "power2.in" }, 10.4);

      // Penutup: nama usaha, ajakan, alamat; diam supaya sempat dibaca.
      tl.from("#cta .usaha", { yPercent: 60, opacity: 0, duration: 0.6, ease: "expo.out" }, 10.8)
        .from("#ajak", { scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(1.8)" }, 11.15)
        .from("#cta .info", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 11.4)
        .to("#ajak", { scale: 1.05, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 12)
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
