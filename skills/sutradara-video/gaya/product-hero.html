<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Produk utama</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-500.woff2"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-800.woff2"); font-weight: 800; }
      @font-face { font-family: "Archivo Black"; src: url("vendor/ArchivoBlack-400.woff2"); font-weight: 400; }
      /* Warna merek: ganti nilai ini. */
      :root { --latar: #2a0a0a; --latar2: #5c1010; --utama: #ff3b30; --aksen: #ffc93c; --teks: #fff6ee; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--latar); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--teks);
        font-family: "Poppins", sans-serif; background: radial-gradient(120% 70% at 50% 38%, var(--latar2), var(--latar) 70%); }
      .rays { position: absolute; left: -460px; top: -280px; width: 2000px; height: 2000px; opacity: 0.5;
        background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--aksen) 16%, transparent) 0deg 8deg, transparent 8deg 22deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); mask-image: radial-gradient(circle, #000 0%, transparent 60%); }
      .badge { position: absolute; right: 110px; top: 300px; width: 220px; height: 220px; border-radius: 50%;
        background: var(--aksen); color: var(--latar); display: flex; align-items: center; justify-content: center;
        text-align: center; font-weight: 800; font-size: 48px; line-height: 1; }
      .stage { position: absolute; left: 0; right: 0; top: 380px; height: 760px; }
      .shadow { position: absolute; left: 340px; top: 690px; width: 400px; height: 60px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent); }
      .jar { position: absolute; left: 330px; top: 60px; width: 420px; height: 660px; }
      .title { position: absolute; left: 80px; right: 80px; top: 1170px; text-align: center; }
      .title .line { display: block; overflow: hidden; }
      .title .line span { display: inline-block; }
      .kecil { font-size: 46px; font-weight: 500; color: var(--aksen); }
      .besar { font-size: 104px; white-space: nowrap; font-weight: 800; line-height: 1.02; letter-spacing: -2px; }
      .chips { position: absolute; left: 80px; right: 80px; top: 1400px; display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
      .chip { padding: 18px 34px; border-radius: 60px; border: 3px solid color-mix(in srgb, var(--teks) 40%, transparent);
        font-size: 44px; font-weight: 500; }
      .price { position: absolute; left: 80px; right: 80px; top: 1180px; text-align: center; }
      .coret { position: relative; display: inline-block; font-size: 70px; font-weight: 500; opacity: 0.7; }
      .coret i { position: absolute; left: -8px; right: -8px; top: 50%; height: 7px; background: var(--utama); transform-origin: 0 50%; }
      .now { font-family: "Archivo Black"; font-size: 160px; line-height: 1.05; color: var(--aksen); }
      .cta { position: absolute; left: 110px; right: 110px; top: 1490px; height: 150px; border-radius: 80px; background: var(--utama);
        display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 800; white-space: nowrap; }
      .usaha { position: absolute; left: 80px; right: 80px; top: 230px; text-align: center; font-size: 46px; font-weight: 800;
        letter-spacing: 8px; text-transform: uppercase; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="30">
      <div class="rays" id="rays"></div>
      <div class="usaha" id="usaha">Dapur Bu Rini</div>
      <div class="stage" id="stage">
        <div class="shadow" id="shadow"></div>
        <!-- Produk digambar dengan SVG: bentuk sederhana, warna merek, label berisi nama. -->
        <svg class="jar" id="jar" viewBox="0 0 420 660">
          <defs>
            <linearGradient id="kaca" x1="0" x2="1">
              <stop offset="0" stop-color="#8f1a12" /><stop offset="0.5" stop-color="#d6301f" /><stop offset="1" stop-color="#7a140e" />
            </linearGradient>
          </defs>
          <rect x="70" y="20" width="280" height="110" rx="24" fill="#1d1d1d" />
          <rect x="70" y="100" width="280" height="22" fill="#333" />
          <path d="M60 140 h300 q30 0 30 40 v400 q0 60 -60 60 h-240 q-60 0 -60 -60 v-400 q0 -40 30 -40z" fill="url(#kaca)" />
          <rect x="60" y="280" width="300" height="230" fill="#fff6ee" />
          <text x="210" y="370" text-anchor="middle" font-family="Archivo Black" font-size="56" fill="#2a0a0a">SAMBAL</text>
          <text x="210" y="440" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="44" fill="#d6301f">BAWANG</text>
          <text x="210" y="485" text-anchor="middle" font-family="Poppins" font-weight="500" font-size="24" fill="#2a0a0a">level pedas 5</text>
          <rect x="95" y="170" width="26" height="380" rx="13" fill="#fff" opacity="0.25" />
        </svg>
      </div>
      <div class="badge" id="badge">BARU<br />RILIS</div>

      <div class="title" id="title">
        <span class="line"><span class="kecil">Pedasnya nampol, wanginya juara</span></span>
        <span class="line"><span class="besar">Sambal Bawang</span></span>
      </div>
      <div class="chips" id="chips">
        <div class="chip">Tanpa pengawet</div>
        <div class="chip">Tahan 2 bulan</div>
        <div class="chip">Botol 200 gr</div>
      </div>

      <div class="price" id="price">
        <div class="coret">Rp35.000<i id="garis"></i></div>
        <div class="now" id="now">Rp25.000</div>
      </div>
      <div class="cta" id="cta">Pesan sekarang · 0812-3456-7890</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#rays", { rotation: 0, scale: 0.6 }, { rotation: 40, scale: 1, duration: 15, ease: "none" }, 0)
        .from("#usaha", { y: -40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2)
        // Produk jatuh dan memantul, bayangan ikut mengecil-membesar.
        .from("#jar", { y: -1100, rotation: -14, duration: 0.9, ease: "bounce.out" }, 0.1)
        .from("#shadow", { scale: 0.2, opacity: 0, duration: 0.9, ease: "bounce.out" }, 0.1)
        .from("#badge", { scale: 0, rotation: -90, duration: 0.6, ease: "back.out(2)" }, 1.0)
        .to("#badge", { rotation: 12, duration: 0.8, yoyo: true, repeat: 7, ease: "sine.inOut" }, 1.6)
        // Produk melayang pelan selama video.
        .to("#jar", { y: -24, duration: 1.4, yoyo: true, repeat: 8, ease: "sine.inOut" }, 1.2)
        .from(".title .line span", { yPercent: 110, duration: 0.65, ease: "expo.out", stagger: 0.15 }, 1.3)
        .from(".chip", { y: 60, opacity: 0, scale: 0.8, duration: 0.5, ease: "back.out(1.7)", stagger: 0.18 }, 2.6)
        .to(["#title", "#chips"], { y: -60, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.06 }, 6.6);

      // Harga: harga lama dicoret, harga baru dihitung naik lalu menghentak.
      const harga = { v: 0 };
      const now = document.getElementById("now");
      tl.from(".coret", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 7.1)
        .from("#garis", { scaleX: 0, duration: 0.45, ease: "power2.inOut" }, 7.7)
        .from("#now", { scale: 0.5, opacity: 0, duration: 0.5, ease: "back.out(1.8)" }, 8.0)
        .to(harga, {
          v: 25000, duration: 1, ease: "power2.out",
          onUpdate: () => { now.textContent = "Rp" + (Math.round(harga.v / 1000) * 1000).toLocaleString("id-ID"); },
        }, 8.0)
        .to("#now", { scale: 1.1, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 9.0)
        .from("#cta", { y: 220, opacity: 0, duration: 0.7, ease: "expo.out" }, 9.6)
        .to("#cta", { scale: 1.05, duration: 0.45, yoyo: true, repeat: 5, ease: "sine.inOut" }, 10.6)
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
