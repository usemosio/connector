<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Angka dan grafik</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("vendor/SpaceGrotesk-500.woff2"); font-weight: 500; }
      @font-face { font-family: "Space Grotesk"; src: url("vendor/SpaceGrotesk-700.woff2"); font-weight: 700; }
      /* Warna merek: ganti nilai ini. */
      :root { --latar: #061a2b; --utama: #22c3ee; --aksen: #a3e635; --teks: #eaf6ff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--latar); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--latar); color: var(--teks);
        font-family: "Space Grotesk", sans-serif; }
      .glow { position: absolute; width: 1200px; height: 1200px; left: -60px; top: 300px; border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--utama) 26%, transparent), transparent 60%); }
      .label { position: absolute; left: 90px; right: 90px; top: 280px; font-size: 52px; font-weight: 500; opacity: 0.8; }
      .big { position: absolute; left: 80px; right: 80px; top: 350px; font-size: 250px; font-weight: 700; line-height: 1; letter-spacing: -8px; color: var(--utama); }
      .unit { position: absolute; left: 90px; right: 90px; top: 610px; font-size: 64px; font-weight: 700; }
      .chart { position: absolute; left: 90px; right: 90px; top: 790px; height: 560px; display: flex; align-items: flex-end; gap: 40px;
        border-bottom: 4px solid color-mix(in srgb, var(--teks) 35%, transparent); }
      .bar { flex: 1; position: relative; border-radius: 22px 22px 0 0; background: color-mix(in srgb, var(--utama) 55%, transparent); }
      .bar.top { background: var(--aksen); }
      .bar b { position: absolute; left: 0; right: 0; top: -70px; text-align: center; font-size: 46px; }
      .bar span { position: absolute; left: 0; right: 0; bottom: -70px; text-align: center; font-size: 40px; opacity: 0.75; }
      .ring { position: absolute; left: 90px; top: 1460px; width: 230px; height: 230px; }
      .ring-text { position: absolute; left: 350px; right: 90px; top: 1480px; }
      .ring-text b { display: block; font-size: 96px; line-height: 1; color: var(--aksen); }
      .ring-text span { font-size: 46px; }
      .end { position: absolute; inset: 0; background: var(--utama); color: var(--latar); display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
      .end .toko { font-size: 110px; font-weight: 700; line-height: 1.02; }
      .end .ajak { margin-top: 36px; font-size: 56px; font-weight: 500; }
      .end .kontak { margin-top: 50px; padding: 26px 56px; border-radius: 80px; background: var(--latar); color: var(--teks); font-size: 52px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="30">
      <div class="glow" id="glow"></div>
      <div class="label" id="label">Bulan ini kami mencuci</div>
      <div class="big" id="big">0</div>
      <div class="unit" id="unit">kg pakaian pelanggan</div>
      <div class="chart" id="chart">
        <div class="bar" style="height: 34%"><b>4,1t</b><span>Jul</span></div>
        <div class="bar" style="height: 52%"><b>6,3t</b><span>Agu</span></div>
        <div class="bar" style="height: 71%"><b>8,6t</b><span>Sep</span></div>
        <div class="bar top" style="height: 100%"><b>12t</b><span>Okt</span></div>
      </div>
      <svg class="ring" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(234,246,255,0.18)" stroke-width="12" />
        <circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="#a3e635" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90 50 50)" />
      </svg>
      <div class="ring-text" id="ring-text"><b id="puas">0%</b><span>pelanggan puas dan langganan lagi</span></div>
      <div class="end" id="end">
        <div class="toko">Laundry Kilat Bersih</div>
        <div class="ajak">Antar-jemput gratis, selesai 1 hari</div>
        <div class="kontak">WA 0812-3456-7890</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const fmt = (n) => Math.round(n).toLocaleString("id-ID");

      tl.fromTo("#glow", { scale: 0.8 }, { scale: 1.15, duration: 15, ease: "sine.inOut" }, 0)
        .from("#label", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.2);

      // Angka besar dihitung naik.
      const kg = { v: 0 };
      const big = document.getElementById("big");
      tl.from("#big", { y: 80, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.4)
        .to(kg, { v: 12000, duration: 2, ease: "power3.out", onUpdate: () => { big.textContent = fmt(kg.v) + "+"; } }, 0.4)
        .from("#unit", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 1.2)
        // Diagram batang tumbuh dari bawah, lalu angka di atasnya.
        .from(".bar", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.8, ease: "expo.out", stagger: 0.2 }, 2.4)
        .from(".bar b", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out", stagger: 0.2 }, 3.0)
        .from(".bar span", { opacity: 0, duration: 0.4, stagger: 0.2 }, 2.6)
        .to(".bar.top", { scaleY: 1.04, transformOrigin: "50% 100%", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.2);

      // Cincin persentase digambar sambil angkanya naik.
      const pct = { v: 0 };
      const puas = document.getElementById("puas");
      tl.from(".ring", { scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(1.8)" }, 5.4)
        .fromTo("#arc", { attr: { "stroke-dashoffset": 264 } }, { attr: { "stroke-dashoffset": 264 * 0.02 }, duration: 1.4, ease: "power2.out" }, 5.6)
        .to(pct, { v: 98, duration: 1.4, ease: "power2.out", onUpdate: () => { puas.textContent = Math.round(pct.v) + "%"; } }, 5.6)
        .from("#puas", { opacity: 0, duration: 0.3 }, 5.6)
        .from("#ring-text span", { x: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 6.0)
        .fromTo("#end", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "expo.inOut" }, 9.6)
        .from("#end > *", { y: 70, opacity: 0, duration: 0.55, ease: "power3.out", stagger: 0.14 }, 10.1)
        .to(".end .kontak", { scale: 1.05, duration: 0.45, yoyo: true, repeat: 5, ease: "sine.inOut" }, 11.2)
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
