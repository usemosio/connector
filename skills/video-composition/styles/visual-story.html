<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>Visual story: kenapa sarang lebah segi enam?</title>

    <style>
      /*
        VISUAL STORY: a silent explainer told by one illustrated world and a moving camera.
        Arc: hook question -> rule -> a number you can see -> consequence -> payoff (bookend).
        Captions carry the script word by word on a reading clock (about 1.2x speaking pace).
        Colour is semantic for the whole film: gold = the subject, red = worst, amber = middle,
        green = best, slate = "the others".
      */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0a07; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d0a07; font-family: "Inter", sans-serif; }
      #film { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      /* warm dark world with a faint 40 px grid */
      #bg { background: radial-gradient(ellipse 80% 55% at 50% 50%, #2a1d0e 0%, #140f09 55%, #0d0a07 100%); }
      #bg::after { content: ""; position: absolute; inset: 0; background-size: 40px 40px;

      #honeybg { background: radial-gradient(ellipse 90% 70% at 50% 42%, #d08408 0%, #6b3a05 58%, #2a1503 100%); }
      #flash { background: radial-gradient(ellipse 70% 60% at 50% 48%, #ffe7a3 0%, #ffb300 45%, #a85f00 100%); }
      #vignette { background: radial-gradient(ellipse 85% 70% at 50% 50%, transparent 55%, rgba(5,4,2,0.75) 100%); }
      /* dark scrim behind the caption band so captions read over bright scenes */
      #scrim { background: linear-gradient(to bottom, rgba(13,10,7,0.9) 0%, rgba(13,10,7,0.8) 22%, rgba(13,10,7,0) 30%); }

      /* ---------- caption engine: one pre-laid line per reveal state ---------- */
      #cap { position: absolute; left: 80px; top: 300px; width: 920px; height: 160px; }
      .cl { position: absolute; left: 0; top: 0; width: 920px; text-align: center; font-size: 60px; line-height: 1.22; letter-spacing: -0.012em; opacity: 0; }
      .w { display: inline-block; position: relative; font-weight: 400; color: rgba(255,255,255,0.45); }
      .w.on { color: #ffffff; font-weight: 700; }
      .w .tx { position: relative; }
      /* Figma-style selection box on the key term (sits before the text in DOM order) */
      .box { position: absolute; left: -9px; right: -9px; top: -3px; bottom: -5px; }
      .box .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #151e36; }
      .box .e { position: absolute; display: block; background: #2f66b8; }

      .box .er { right: 0; top: 0; width: 2px; height: 100%; transform-origin: 50% 0; }
      .box .eb { left: 0; bottom: 0; width: 100%; height: 2px; transform-origin: 100% 50%; }
      .box .el { left: 0; top: 0; width: 2px; height: 100%; transform-origin: 50% 100%; }
      .box .h { position: absolute; display: block; width: 14px; height: 14px; border-radius: 50%; background: #257bff; box-shadow: 0 0 0 2px #ffffff; }
      .box .h1 { left: -7px; top: -7px; }
      .box .h2 { right: -7px; bottom: -7px; }

      /* ---------- UI pieces in HTML (all text 40 px or larger) ---------- */
      .plab { position: absolute; top: 1110px; width: 300px; text-align: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.62); }
      .plab span { display: inline-block; }
      .tag { position: absolute; left: 0; top: 560px; width: 1080px; display: flex; justify-content: center; align-items: center; gap: 18px; font-size: 44px; font-weight: 700; color: #ffffff; }
      .pill { border: 3px solid #ff6369; color: #ff6369; font-size: 40px; letter-spacing: 0.06em; padding: 2px 16px; border-radius: 10px; }
      .pin { position: absolute; font-size: 64px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,0.85); }
      .label { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.78); }
      .counter { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 130px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      #fcard { position: absolute; left: 120px; top: 840px; width: 840px; height: 230px; border-radius: 28px; background: rgba(26,16,6,0.74);
        border: 2px solid rgba(255,214,140,0.35); box-shadow: 0 30px 70px rgba(0,0,0,0.45); }
      #fcard .f { position: absolute; left: 0; top: 38px; width: 836px; text-align: center; font-size: 72px; font-weight: 700; color: #fff4dc; }
      #fcard .fl { position: absolute; left: 0; top: 148px; width: 836px; text-align: center; font-size: 40px; color: rgba(255,240,210,0.72); }
      #strike { position: absolute; display: block; left: 150px; top: 78px; width: 536px; height: 8px; border-radius: 4px; background: #ff4d55; transform-origin: 0 50%; }
      /* the footnote is the only thing in the bottom 420 px */
      #foot { position: absolute; left: 80px; top: 1790px; font-size: 40px; color: rgba(255,255,255,0.6); }
    </style>

        <svg id="world" class="layer" viewBox="0 0 1080 1920"><defs>

              <path d="M-12 6 l-6 10 M-4 8 l-2 11 M4 8 l3 10" stroke="#2a1a08" stroke-width="2.2" stroke-linecap="round" fill="none" /><ellipse cx="12" cy="2" rx="17" ry="12" fill="url(#gBee)" />
              <g clip-path="url(#cpAbd)" fill="#2a1806"><rect x="6" y="-12" width="4.5" height="28" /><rect x="15" y="-12" width="4.5" height="28" /><rect x="24" y="-12" width="5" height="28" /></g>
              <circle cx="-6" cy="0" r="10" fill="#7a5420" /><circle cx="-19" cy="2" r="8" fill="#2a1a0b" /><circle cx="-23" cy="-1.5" r="1.1" fill="#fff" opacity="0.8" />
              <path d="M-23 -5 q-6 -10 -12 -9 M-19 -6 q-3 -10 -8 -12" stroke="#2a1a08" stroke-width="1.8" fill="none" stroke-linecap="round" /></g></defs>

          <g id="bubbles"></g><g id="finale"><g id="finCam"></g></g></svg>
        <div id="vignette" class="layer"></div><div id="scrim" class="layer"></div>
        <div class="plab" id="lab-tri" style="left: 70px"><span id="ln-tri">Segitiga</span></div><div class="plab" id="lab-sq" style="left: 390px"><span id="ln-sq">Persegi</span></div>
        <div class="plab" id="lab-hex" style="left: 710px"><span id="ln-hex">Segi enam</span></div>
        <div class="tag" id="tag"><span class="pill">UJI</span><span>madu sama</span></div>
        <div class="pin" id="pin-tri" style="color: #ff6369">0.00</div><div class="pin" id="pin-sq" style="color: #f5a524">0.00</div><div class="pin" id="pin-hex" style="color: #3dd68c">0.00</div>
        <div class="label" id="barsLabel" style="top: 1395px">dinding per sel · luas sama</div><div class="counter" id="pct" style="top: 1215px; color: #3dd68c">−0%</div>
        <div class="label" id="pctLabel" style="top: 1365px">lilin lebih hemat dari sel persegi</div>
        <div id="fcard"><div class="f">P = 2·√(2√3·A)</div><div class="fl">dinding tersedikit untuk luas A</div><span id="strike"></span></div>
        <div id="flash" class="layer"></div><div id="foot">Ilustrasi · tidak sesuai skala</div><div id="cap"></div></div>
    </div>
    <script>
      /* HOW TO ADAPT: (1) replace PHRASES (reading clock, about 1.2x speaking pace, 0.3 s or more between phrases); (2) cues are looked up

         GSAP handles opacity, filters and simple tweens.   0.0-2.9 1 HOOK: illustrated comb, camera pushes into the cell being built |
         2.9-10.7 2 RULE: the hero cell flies into three tilings, gaps shut, each shape lights up | 10.7-16.0 3 TEST: centre cells rise into
         prisms, fill with honey, walls explode into bars | 16.0-18.9 4 RESULT: the hexagon returns, the comb grows, -7 % | 18.9-21.3 5 INSIDE:
         push into the honey, gold flash, formula struck through | 21.3-25.5 6 PAYOFF: the hook's comb finished, hold, fade out */
      // ===== 0. SCRIPT on the reading clock (seconds). "_" = a no-break space inside one token; em = the token that gets the selection box =====
      const DUR = 25.5, PHRASES = [
        { em: 4, w: [["Kenapa", 0.1], ["sarang", 0.58], ["lebah", 0.92], ["bentuknya", 1.32], ["segi_enam?", 1.83]] },
        { w: [["Cuma", 2.88], ["ada", 3.19], ["tiga", 3.41], ["bentuk", 3.72]] }, { w: [["yang", 4.52], ["bisa", 4.69], ["nutup", 4.88], ["rapat", 5.31]] },
        { w: [["tanpa", 6.17], ["celah:", 6.5]] }, { w: [["segitiga,", 7.42], ["persegi,", 8.55]] }, { w: [["dan", 9.47], ["segi_enam.", 9.62]] },
        { w: [["Buat", 10.74], ["nampung", 10.98], ["madu", 11.34], ["yang", 11.65], ["sama,", 11.77]] }, { w: [["segi_enam", 12.61], ["butuh", 13.21], ["dinding", 13.69]] },
        { em: 0, w: [["paling_sedikit.", 14.47]] }, { w: [["Lilinnya", 15.99], ["lebih", 16.49], ["hemat,", 16.68]] }, { w: [["madunya", 17.53], ["lebih", 18.09], ["banyak.", 18.47]] },
        { w: [["Lebah", 19.38], ["nggak", 19.83], ["perlu", 20.0], ["rumus.", 20.26]] }, { em: 0, w: [["Segi_enam", 21.28], ["udah", 21.93], ["paling", 22.2], ["efisien.", 22.77]] }];
      const TOKENS = PHRASES.flatMap((p) => p.w), norm = (s) => s.toLowerCase().replace(/_/g, " ").replace(/[?.,:!]/g, "");
      const at = (word, n = 1) => TOKENS.filter(([w]) => norm(w) === word)[n - 1][1]; // start of the n-th token that reads `word`
      const C = { // every beat lands on its word
        close: at("segi enam"), handoff: at("cuma"), pop: at("tiga"), //   1.83 builder closes the cell; 2.88 hero flies; 3.41 tilings pop
        shut0: at("nutup"), shut1: at("rapat") + 0.15, seams: at("celah"), // 4.88-5.46 gaps shut; 6.50 seams flash
        tri: at("segitiga"), sq: at("persegi"), hex: at("segi enam", 2), //  7.42 / 8.55 / 9.62 each tiling lights up
        lift: at("buat"), same: at("sama"), focus: at("segi enam", 3), //  10.74 tilings stand up; 11.77 equal honey; 12.61 hexagon glows
        explode: at("dinding"), measure: at("paling sedikit"), //            13.69 walls fly into bars; 14.47 tint + counters
        back: at("lilinnya"), fill: at("madunya"), pct: at("lebih", 2), //  15.99 hexagon returns; 17.53 comb fills; 18.09 -7 %
        cutIn: at("lebah", 2), strike: at("rumus"), cutOut: at("segi enam", 4) }; // 19.38 into the honey; 20.26 strike; 21.28 finale
      Object.assign(C, { land: C.handoff + 0.5, grow: C.back + 0.7, dive: C.cutIn - 0.45 }); // hero lands; comb grows; push-in starts
      // ===== helpers =====

      const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }, el = (tag, attrs, parent) => parent.appendChild(set(document.createElementNS("http://www.w3.org/2000/svg", tag), attrs));
      const pts = (a) => a.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "), clamp01 = (v) => Math.max(0, Math.min(1, v)), lerp = (a, b, u) => a + (b - a) * u;
      const io = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2), eOut = (u) => 1 - Math.pow(1 - u, 3), seg = (t, a, b, ease = io) => ease(clamp01((t - a) / (b - a)));
      const backOut = (u) => (u <= 0 ? 0 : 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2)), EASE = { io, lin: (u) => u, in5: (u) => u ** 5, out: eOut };

      function keyed(keys, t) { // interpolates every numeric field between time keys; `e` = the ease into that key
        let i = 0, o = {}; while (i < keys.length - 1 && t >= keys[i + 1].t) i++;
        const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)], u = b.t > a.t ? EASE[b.e || "io"](clamp01((t - a.t) / (b.t - a.t))) : 1;
        for (const k in a) if (typeof a[k] === "number") o[k] = lerp(a[k], b[k], u); return o; }
      const fadeIn = (n, t, d = 0.25) => tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t), fadeOut = (n, t, d = 0.2) => tl.to(n, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const counter = (node, to, t, dec, pre = "", suf = "") => { const o = { v: 0 }; tl.to(o, { v: to, duration: 0.5, ease: "power2.out", onUpdate: () => (node.textContent = pre + o.v.toFixed(dec) + suf) }, t); };
      const hexVerts = (r) => Array.from({ length: 6 }, (_, j) => [r * Math.cos((Math.PI / 3) * j), r * Math.sin((Math.PI / 3) * j)]);
      const GRAD = [ // materials: [id, "l" (diagonal) | "v" (vertical) | [cx, cy, r] (radial, %), stops [offset, colour, opacity?]]
        ["gWax", "l", [[0, "#ffe9a8"], [0.45, "#ebb04a"], [1, "#b3721a"]]], ["gSlate", "l", [[0, "#e3e8f2"], [0.5, "#b3bccf"], [1, "#7d879c"]]], ["gLeaf", "l", [[0, "#7a9a46"], [1, "#2c4416"]]],
        ["gBark", "v", [[0, "#8a5c34"], [0.45, "#5a3a1d"], [1, "#2c1a0b"]]], ["gHoney", [40, 35, 75], [[0, "#ffde70"], [0.5, "#f4aa1f"], [1, "#a65a00"]]],
        ["gCap", [42, 38, 70], [[0, "#fff4d2"], [0.6, "#ebcc85"], [1, "#c3913e"]]], ["gEmpty", [58, 62, 70], [[0, "#1a0f05"], [0.7, "#3a2209"], [1, "#6a4413"]]],
        ["gBee", [40, 35, 70], [[0, "#ffe58a"], [0.6, "#f2b11e"], [1, "#9a6100"]]], ["gBokeh", [50, 50, 50], [[0, "#ffcf7a", 0.35], [1, "#ffcf7a", 0]]], ["gShadow", [50, 50, 50], [[0, "#000", 0.5], [1, "#000", 0]]],
        ["gBubble", [50, 50, 50], [[0, "#fff0c8", 0], [0.72, "#ffe6aa", 0.3], [0.92, "#fffae6", 0.9], [1, "#fffae6", 0]]]];
      GRAD.forEach(([id, k, stops]) => {
        const g = Array.isArray(k) ? el("radialGradient", { id, cx: k[0] + "%", cy: k[1] + "%", r: k[2] + "%" }, $("world").firstElementChild) : el("linearGradient", { id, x1: 0, y1: 0, x2: k === "v" ? 0 : 1, y2: 1 }, $("world").firstElementChild);
        stops.forEach(([o, c, a = 1]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g)); });
      // ===== 1. HOOK: the illustrated comb on a branch (0 - 2.9 s) =====
      const R = 70, CY = 1000, combPx = (q, r) => [540 + 1.5 * q * R, CY + R3 * (r + q / 2) * R], COMB_QR = []; // flat-top hex grid -> screen
      for (let q = -3; q <= 3; q++) for (let r = -3; r <= 3; r++) { const ring = Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)); if (ring <= 3) COMB_QR.push({ q, r, ring }); }
      const ring2 = (r) => "M" + pts(hexVerts(r)) + " Z M" + pts(hexVerts(r * 0.88)) + " Z", WAX_RIM = { "fill-rule": "evenodd", fill: "url(#gWax)", stroke: "rgba(90,52,10,0.55)", "stroke-width": 1.4 };
      function cellArt(parent, cx, cy, state) { // one illustrated cell: content + wax rim
        const g = el("g", { transform: `translate(${cx} ${cy})` }, parent);
        el("polygon", { points: pts(hexVerts(R * 0.88)), fill: `url(#g${state[0].toUpperCase() + state.slice(1)})` }, g);
        if (state === "honey") el("ellipse", { cx: -20, cy: -23, rx: 21, ry: 8, transform: "rotate(-24 -20 -23)", fill: "#fff", opacity: 0.5 }, g);
        if (state === "cap") el("ellipse", { cx: -10, cy: -14, rx: 29, ry: 21, fill: "#fffaf0", opacity: 0.28 }, g);
        return el("path", { d: ring2(R), ...WAX_RIM }, g), g; }
      function branchArt(parent, y) {
        el("path", { d: `M-60 ${y} C 300 ${y - 22}, 720 ${y + 14}, 1140 ${y - 12} L 1140 ${y + 54} C 720 ${y + 72}, 300 ${y + 40}, -60 ${y + 58} Z`, fill: "url(#gBark)" }, parent);
        [[-20, 14, 380, 8], [200, 30, 520, 26], [560, 20, 900, 28], [760, 40, 1100, 24]].forEach(([x1, y1, x2, y2]) => el("path", { d: `M${x1} ${y + y1} Q ${(x1 + x2) / 2} ${y + y1 - 8} ${x2} ${y + y2}`, stroke: "rgba(25,14,5,0.55)", "stroke-width": 2.2, fill: "none" }, parent));
        el("path", { d: `M300 ${y + 40} C 380 ${y + 80}, 700 ${y + 84}, 780 ${y + 40} Z`, fill: "#d9a243", opacity: 0.9 }, parent); }
      const leaf = (parent, x, y, s, rot) => el("path", { d: "M0 0 C 40 -36, 120 -30, 160 0 C 120 30, 40 36, 0 0 Z", fill: "url(#gLeaf)", filter: "url(#fBlur)", transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})` }, parent);
      const bee = (parent) => { const g = el("g", {}, parent); el("use", { href: "#beeDef" }, g); return g; };
      const beeT = (g, x, y, rot, s) => g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${s})`);
      const orbit = (b, t, w, cy) => { const a = w * t + b.ph; beeT(b.g, 540 + b.rx * Math.cos(a), cy + b.ry * Math.sin(a) + 10 * Math.sin(9 * t + b.ph), Math.atan2(b.ry * Math.cos(a), -b.rx * Math.sin(a)) / D2R + 180, 0.95); };
      function buildComb(parent, stateOf) { // shadow + branch + comb; stateOf(cell) -> "honey" | "cap" | "empty" | null (left out)
        el("ellipse", { cx: 540, cy: CY + 40, rx: 460, ry: 480, fill: "url(#gShadow)" }, parent);
        const branch = el("g", {}, parent), comb = el("g", {}, parent), cells = COMB_QR.map((c) => ({ ...c, st: stateOf(c), xy: combPx(c.q, c.r) })).filter((c) => c.st);
        return cells.forEach((c) => (c.g = cellArt(comb, c.xy[0], c.xy[1], c.st))), branchArt(branch, 520), { branch, comb, cells }; }
      const HERO = { q: 2, r: 0 }, [HX, HY] = combPx(HERO.q, HERO.r), cam = $("cam"), rndArt = mulberry32(5); // the hero = the cell being built
      [[40, 600, 0.9, -160], [930, 560, 1.0, -20], [990, 640, 0.75, 25], [-30, 700, 0.7, -140]].forEach(([x, y, s, r]) => leaf($("leavesFar"), x, y, s, r));
      for (let i = 0; i < 16; i++) el("circle", { cx: rndArt() * 1080, cy: 520 + rndArt() * 900, r: 10 + rndArt() * 34, fill: "url(#gBokeh)" }, $("bokeh"));
      buildComb(cam, ({ q, r, ring }) => (q === HERO.q && r === HERO.r) || (ring === 3 && combPx(q, r)[0] > 650 && combPx(q, r)[1] > 1090) ? null // hero + an unfinished corner
        : ring <= 1 ? (q === 1 && r === -1 ? "cap" : "honey") : ring === 2 ? ((q + 2 * r) % 3 === 0 ? "cap" : "honey") : (q + r) % 2 ? "empty" : "cap");
