<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Explainer isometrik (16:9)</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-500.woff2"); font-weight: 500; }
      @font-face { font-family: "Poppins"; src: url("vendor/Poppins-800.woff2"); font-weight: 800; }
      /* Warna merek: ganti nilai ini. Contoh layar lebar 1920×1080 untuk YouTube, website, dan layar toko. */
      :root { --latar: #f4f8f8; --tinta: #1f2a44; --utama: #0e8a8a; --aksen: #e0685a; --redup: #6b7a90; --panggung: #dceeee; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--latar); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--latar); color: var(--tinta);
        font-family: "Poppins", sans-serif; }
      .glow { position: absolute; width: 1400px; height: 1400px; left: 700px; top: -300px; border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--utama) 14%, transparent), transparent 62%); }
      .copy { position: absolute; left: 140px; top: 300px; width: 720px; }
      .copy .t { position: absolute; left: 0; top: 0; width: 720px; font-size: 92px; font-weight: 800; line-height: 1.04; letter-spacing: -2px; }
      .copy .t .line { display: block; overflow: hidden; }
      .copy .t .line span { display: block; }
      .copy .t b { color: var(--aksen); }
      .copy .t.solusi b { color: var(--utama); }
      .stage { position: absolute; left: 960px; top: 160px; width: 860px; height: 760px; }
      .stage svg { width: 100%; height: 100%; overflow: visible; }
      .end { position: absolute; inset: 0; background: var(--latar); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .end .judul { font-size: 96px; font-weight: 800; letter-spacing: -2px; }
      .end .merek { margin-top: 30px; display: flex; align-items: center; gap: 26px; font-size: 110px; font-weight: 800; color: var(--utama); }
      .end .merek i { width: 110px; height: 110px; border-radius: 28px; background: var(--utama); }
      .end .tombol { margin-top: 56px; padding: 26px 64px; border-radius: 80px; background: var(--utama); color: #fff; font-size: 48px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-fps="30">
      <div class="glow" id="glow"></div>
      <div class="copy">
        <div class="t" id="t1"><span class="line"><span>Riwayat pasien</span></span><span class="line"><span>tersebar di</span></span><span class="line"><span><b>banyak lembar.</b></span></span></div>
        <div class="t" id="t2"><span class="line"><span>Akhir bulan,</span></span><span class="line"><span>rekap makan</span></span><span class="line"><span><b>4 jam.</b></span></span></div>
        <div class="t solusi" id="t3"><span class="line"><span>Satu klik,</span></span><span class="line"><span>laporan</span></span><span class="line"><span><b>tersusun rapi.</b></span></span></div>
      </div>
      <div class="stage">
        <svg viewBox="0 0 860 760">
          <!-- panggung isometrik -->
          <polygon points="430,330 840,560 430,790 20,560" fill="#dceeee" stroke="#9fb9bc" stroke-width="3" />
          <polygon points="20,560 20,590 430,820 430,790" fill="#c9e2e2" />
          <polygon points="840,560 840,590 430,820 430,790" fill="#b8d8d8" />
          <!-- tumpukan berkas (masalah) -->
          <g id="berkas">
            <g class="lembar"><polygon points="230,500 330,555 230,610 130,555" fill="#ffffff" stroke="#1f2a44" stroke-width="3" /></g>
            <g class="lembar"><polygon points="230,482 330,537 230,592 130,537" fill="#ffffff" stroke="#1f2a44" stroke-width="3" /></g>
            <g class="lembar"><polygon points="230,464 330,519 230,574 130,519" fill="#ffffff" stroke="#1f2a44" stroke-width="3" /></g>
            <g class="lembar"><polygon points="560,560 660,615 560,670 460,615" fill="#ffffff" stroke="#1f2a44" stroke-width="3" /><line x1="520" y1="600" x2="590" y2="640" stroke="#e0685a" stroke-width="5" /></g>
            <g class="lembar"><polygon points="430,640 530,695 430,750 330,695" fill="#ffffff" stroke="#1f2a44" stroke-width="3" /><line x1="390" y1="680" x2="460" y2="720" stroke="#e0685a" stroke-width="5" /></g>
          </g>
          <!-- jam (beban kerja) -->
          <g id="jam">
            <circle cx="640" cy="380" r="58" fill="#ffffff" stroke="#1f2a44" stroke-width="5" />
            <line id="jarum" x1="640" y1="380" x2="640" y2="340" stroke="#e0685a" stroke-width="7" stroke-linecap="round" />
          </g>
          <!-- laptop (solusi) -->
          <g id="laptop">
            <polygon points="430,470 700,620 430,770 160,620" fill="#eef2f6" stroke="#1f2a44" stroke-width="4" />
            <g id="layar">
              <polygon points="180,600 180,360 450,210 450,450" fill="#ffffff" stroke="#1f2a44" stroke-width="8" stroke-linejoin="round" />
              <g transform="skewY(-29)">
                <rect id="b1" x="230" y="455" width="34" height="90" fill="#0e8a8a" />
                <rect id="b2" x="290" y="440" width="34" height="140" fill="#0e8a8a" />
                <rect id="b3" x="350" y="420" width="34" height="200" fill="#0e8a8a" />
              </g>
            </g>
          </g>
        </svg>
      </div>
      <div class="end" id="end">
        <div class="judul">Digitalisasi klinik, mudah.</div>
        <div class="merek"><i></i>Sehatku</div>
        <div class="tombol">Coba gratis sekarang</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#glow", { scale: 0.9 }, { scale: 1.12, duration: 15, ease: "sine.inOut" }, 0)
        .from(".stage polygon:not(#berkas polygon):not(#laptop polygon)", { opacity: 0, y: 40, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 0.1);

      // Adegan 1 (0–4 detik): berkas berserakan jatuh ke panggung.
      tl.from("#t1 .line span", { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 0.3)
        .from(".lembar", { y: -220, opacity: 0, duration: 0.6, ease: "bounce.out", stagger: 0.16 }, 0.5)
        .to("#t1 .line span", { yPercent: -110, duration: 0.45, ease: "power2.in", stagger: 0.06 }, 3.7);

      // Adegan 2 (4–8 detik): jam berputar cepat, beban kerja menumpuk.
      tl.from("#jam", { scale: 0, svgOrigin: "640 380", duration: 0.5, ease: "back.out(2)" }, 4.0)
        .from("#t2 .line span", { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 4.1)
        .to("#jarum", { rotation: 1080, svgOrigin: "640 380", duration: 3.0, ease: "power1.in" }, 4.4)
        .to("#t2 .line span", { yPercent: -110, duration: 0.45, ease: "power2.in", stagger: 0.06 }, 7.7);

      // Adegan 3 (8–11 detik): berkas tersedot hilang, laptop muncul, grafik naik.
      tl.to(".lembar", { scale: 0, opacity: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.in", stagger: 0.05 }, 7.9)
        .to("#jam", { scale: 0, opacity: 0, svgOrigin: "640 380", duration: 0.4, ease: "power3.in" }, 8.0)
        .from("#laptop", { y: 120, opacity: 0, duration: 0.7, ease: "expo.out" }, 8.4)
        .from("#layar", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.6, ease: "back.out(1.4)" }, 8.8)
        .from("#b1, #b2, #b3", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.5, ease: "expo.out", stagger: 0.15 }, 9.3)
        .from("#t3 .line span", { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 8.6);

      // Penutup (11–15 detik).
      tl.fromTo("#end", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "expo.inOut" }, 11.2)
        .from("#end > *", { y: 60, opacity: 0, duration: 0.55, ease: "power3.out", stagger: 0.14 }, 11.7)
        .to(".end .tombol", { scale: 1.05, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, 12.6)
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
