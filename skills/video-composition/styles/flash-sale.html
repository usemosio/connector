<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Flash sale</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo Black"; src: url("vendor/ArchivoBlack-400.woff2"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("vendor/SpaceGrotesk-500.woff2"); font-weight: 500; }
      @font-face { font-family: "Space Grotesk"; src: url("vendor/SpaceGrotesk-700.woff2"); font-weight: 700; }
      /* Warna merek: ganti nilai ini. */
      :root { --latar: #0d0d12; --utama: #d7ff3a; --aksen: #ff2e88; --teks: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--latar); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--latar); color: var(--teks);
        font-family: "Space Grotesk", sans-serif; }
      .grid { position: absolute; inset: -200px; opacity: 0.18;
        background-image: linear-gradient(var(--teks) 2px, transparent 2px), linear-gradient(90deg, var(--teks) 2px, transparent 2px);
        background-size: 120px 120px; }
      .flash { position: absolute; inset: 0; background: var(--utama); }
      .head { position: absolute; left: 70px; right: 70px; top: 300px; font-family: "Archivo Black"; font-size: 170px;
        line-height: 0.95; text-transform: uppercase; }
      .head span { display: inline-block; }
      .head .b { color: var(--utama); }
      .pct { position: absolute; left: 40px; right: 40px; top: 680px; text-align: center; font-family: "Archivo Black";
        font-size: 440px; line-height: 1; color: var(--aksen); letter-spacing: -12px; }
      .off { position: absolute; right: 90px; top: 1100px; font-family: "Archivo Black"; font-size: 120px; color: var(--utama); }
      .tape { position: absolute; left: -200px; width: 1480px; height: 120px; overflow: hidden; display: flex; align-items: center; }
      .tape .run { white-space: nowrap; font-family: "Archivo Black"; font-size: 70px; letter-spacing: 4px; }
      .t1 { top: 1280px; background: var(--utama); color: var(--latar); transform: rotate(-7deg); }
      .t2 { top: 1290px; background: var(--aksen); color: var(--teks); transform: rotate(5deg); }
      .info { position: absolute; left: 80px; right: 80px; top: 1280px; text-align: center; }
      .info .label { font-size: 56px; font-weight: 700; letter-spacing: 8px; text-transform: uppercase; color: var(--utama); }
      .tenggat { display: inline-block; margin-top: 18px; padding: 16px 40px; border-radius: 26px; background: var(--utama); color: var(--latar);
        font-family: "Archivo Black"; font-size: 80px; line-height: 1.1; white-space: nowrap; }
      .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--aksen); text-align: center; padding: 0 80px; }
      .end .toko { font-family: "Archivo Black"; font-size: 120px; line-height: 1; }
      .end .ajak { margin-top: 40px; padding: 28px 60px; border-radius: 80px; background: var(--latar); color: var(--utama);
        font-size: 62px; font-weight: 700; }
      .end .kontak { margin-top: 40px; font-size: 52px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="30">
      <div class="grid" id="grid"></div>
      <div class="flash" id="flash"></div>
      <div class="head" id="head">
        <span>Flash</span><br /><span class="b">Sale!</span>
      </div>
      <div class="pct" id="pct">50%</div>
      <div class="off" id="off">OFF</div>
      <div class="tape t2" id="t2"><div class="run" id="run2">SAMPAI MINGGU • SAMPAI MINGGU • SAMPAI MINGGU • SAMPAI MINGGU •</div></div>
      <div class="tape t1" id="t1"><div class="run" id="run1">SEMUA SNEAKERS • SEMUA SNEAKERS • SEMUA SNEAKERS • SEMUA SNEAKERS •</div></div>
      <div class="info" id="info">
        <div class="label" id="label">Berakhir</div>
        <!-- Tenggat ditulis sebagai teks agar tetap benar kapan pun video ditonton. -->
        <div class="tenggat" id="tenggat">Minggu, 23.59 WIB</div>
      </div>
      <div class="end" id="end">
        <div class="toko">LANGKAH SHOES</div>
        <div class="ajak">Belanja sekarang</div>
        <div class="kontak">@langkahshoes · Ruko Sentosa B7</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Kilat pembuka, lalu judul menghentak huruf demi kata.
      tl.fromTo("#flash", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.05)
        .fromTo("#grid", { y: 0 }, { y: 240, duration: 15, ease: "none" }, 0)
        .from("#head span", { scale: 2.6, opacity: 0, duration: 0.45, ease: "expo.out", stagger: 0.22, transformOrigin: "0% 50%" }, 0.15)
        .from("#pct", { scale: 0.2, rotation: -20, opacity: 0, duration: 0.7, ease: "back.out(2.2)" }, 0.8)
        // Getar kecil pada angka, jumlah ulangan tetap.
        .to("#pct", { x: 14, duration: 0.05, yoyo: true, repeat: 9, ease: "none" }, 1.5)
        .from("#off", { x: 300, opacity: 0, duration: 0.5, ease: "expo.out" }, 1.6)
        .from("#t1", { xPercent: -100, duration: 0.6, ease: "expo.out" }, 2.0)
        .from("#t2", { xPercent: 100, duration: 0.6, ease: "expo.out" }, 2.2)
        .fromTo("#run1", { x: 0 }, { x: -900, duration: 9, ease: "none" }, 2.0)
        .fromTo("#run2", { x: -900 }, { x: 0, duration: 9, ease: "none" }, 2.2)
        .to(["#t1", "#t2"], { yPercent: -170, opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6)
        // Tenggat dicap masuk dengan kilat kecil, lalu diam sampai penutup (sekitar 5 detik) supaya terbaca.
        .from("#label", { y: 80, opacity: 0, duration: 0.5, ease: "power3.out" }, 5.0)
        .from("#tenggat", { scale: 1.8, rotation: -6, opacity: 0, duration: 0.45, ease: "expo.out" }, 5.2)
        .fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.06, yoyo: true, repeat: 1, ease: "none", immediateRender: false }, 5.25)
        .fromTo("#end", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: 0.8, ease: "expo.inOut" }, 11)
        .from("#end > *", { y: 80, opacity: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 11.5)
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
